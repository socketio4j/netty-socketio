<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>Socket.IO Browser Interop</title>

    <style>

        body{
            font-family:Arial,sans-serif;
            margin:20px;
        }

        .pass{
            color:green;
            font-weight:bold;
        }

        .fail{
            color:red;
            font-weight:bold;
        }

        pre{
            background:#eee;
            padding:10px;
            white-space:pre-wrap;
        }

    </style>

</head>

<body>

<h2>Socket.IO Browser Interop</h2>

<pre id="log"></pre>

<script>

    const version =
        new URLSearchParams(location.search).get("client") || "4.8.3";

    const CLIENTS = {

        "1.7.3": "https://cdn.jsdelivr.net/npm/socket.io-client@1.7.3/dist/socket.io.min.js",
        "2.1.1": "https://cdn.jsdelivr.net/npm/socket.io-client@2.1.1/dist/socket.io.min.js",
        "2.3.0": "https://cdn.jsdelivr.net/npm/socket.io-client@2.3.0/dist/socket.io.min.js",
        "2.4.0": "https://cdn.jsdelivr.net/npm/socket.io-client@2.4.0/dist/socket.io.min.js",
        "2.5.0": "https://cdn.jsdelivr.net/npm/socket.io-client@2.5.0/dist/socket.io.min.js",
        "3.1.3": "https://cdn.jsdelivr.net/npm/socket.io-client@3.1.3/dist/socket.io.min.js",
        "4.0.0": "https://cdn.jsdelivr.net/npm/socket.io-client@4.0.0/dist/socket.io.min.js",
        "4.7.0": "https://cdn.jsdelivr.net/npm/socket.io-client@4.7.0/dist/socket.io.min.js",
        "4.7.2": "https://cdn.jsdelivr.net/npm/socket.io-client@4.7.2/dist/socket.io.min.js",
        "4.7.5": "https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js",
        "4.8.1": "https://cdn.jsdelivr.net/npm/socket.io-client@4.8.1/dist/socket.io.min.js",
        "4.8.3": "https://cdn.jsdelivr.net/npm/socket.io-client@4.8.3/dist/socket.io.min.js"

    };

    function log(msg){

        console.log(msg);

        document.getElementById("log").textContent += msg + "\n";
    }

    function pass(msg){

        log("PASS : " + msg);
    }

    function fail(msg){

        log("FAIL : " + msg);

        document.body.className="fail";

        document.title="FAIL";

        window.TEST_RESULT="FAIL";
    }

    function success(){

        document.body.className="pass";

        document.title="PASS";

        window.TEST_RESULT="PASS";
    }

    const socketIo=document.createElement("script");

    socketIo.src=CLIENTS[version];

    socketIo.onload = () => {

        const interop = document.createElement("script");

        interop.src = "interop.js";

        interop.onload = () => {
            console.log("interop.js loaded");
        };

        interop.onerror = () => {
            fail("Unable to load interop.js");
        };

        document.body.appendChild(interop);

    };

    socketIo.onerror=()=>{

        fail("Unable to load Socket.IO client "+version);

    };

    document.head.appendChild(socketIo);

</script>

</body>
</html>
